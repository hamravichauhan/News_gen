name: 4x Daily Carousel Engine & Webhook Dispatcher

on:
  # 1. Automated Scheduled Drops (UTC times for IST)
  schedule:
    - cron: "0 3 * * *" # 08:30 AM IST (Morning Briefing)
    - cron: "0 8 * * *" # 01:30 PM IST (Midday Pulse)
    - cron: "0 14 * * *" # 07:30 PM IST (Evening Digest)
    - cron: "0 17 * * *" # 10:30 PM IST (Full Day Top 10)

  # 2. Manual Trigger via GitHub UI
  workflow_dispatch:
    inputs:
      genre:
        description: "Select News Genre"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - AI_TECH
          - DEV_SECURITY
          - SPACE_DEEPTECH
          - INDIA_POLICY
          - GEOPOLITICS
          - BUSINESS_STARTUPS
          - CRYPTO_WEB3
          - GADGETS_HARDWARE
          - GAMING_ESPORTS
          - INTERNET_CULTURE

  # 3. Instant Webhook Trigger from Cloudflare Worker
  repository_dispatch:
    types: [generate_news_carousel]

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Local Folders Exist
        run: |
          mkdir -p data instagram_posts downloads

      - name: Execute Pipeline & Dispatch to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Priority: Webhook payload genre -> Manual UI input genre -> Default to ALL
          TARGET_GENRE="${{ github.event.client_payload.genre || github.event.inputs.genre || 'ALL' }}"
          echo "🚀 Executing pipeline for target genre: [$TARGET_GENRE]"
          python3 pipeline.py --genre "$TARGET_GENRE"

      - name: Persist Deduplication History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add data/posted_history.json || true
          git diff --staged --quiet || git commit -m "chore: persist 48h deduplication ledger [skip ci]"
          git push origin main || true
